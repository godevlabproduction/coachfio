# Counter-Strike 2 - the Phase 2 "deliberately different" second game.
# Source is a REPLAY/STATS export (structured data), NOT video: no HUD schema,
# no OCR. Everything the core needs still comes out as Match/Event/Metric.

identity:
  game_id: cs2
  franchise: counter-strike
  edition: "2"
  display_name: Counter-Strike 2
  platforms: [pc]
  supported_sources: [replay]

# Game vocabulary -> core EventCategory (the core only sees the category).
events:
  - { game_type: round_win,    category: score_change, description: "A team won a round" }
  - { game_type: ace,          category: highlight,    description: "5-kill round" }
  - { game_type: clutch,       category: highlight,    description: "1vX clutch won" }
  - { game_type: bomb_planted, category: highlight,    description: "Bomb planted" }

# Metrics - the score in CS2 is rounds won.
metrics:
  - { key: score_home, label: "Rounds (home)", higher_is_better: true,  source_expr: "derived" }
  - { key: score_away, label: "Rounds (away)", higher_is_better: false, source_expr: "derived" }
  - { key: kills_home, label: "Kills (home)",  higher_is_better: true,  source_expr: "derived" }
  - { key: kills_away, label: "Kills (away)",  higher_is_better: false, source_expr: "derived" }

validation:
  - { metric: score_home, non_negative: true }
  - { metric: score_away, non_negative: true }
