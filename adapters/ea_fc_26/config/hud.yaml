# EA Sports FC - HUD SCHEMA (pure data).
#
# Coordinates are NORMALIZED fractions of frame width/height, [x, y, w, h],
# origin top-left. They scale across resolutions because the HUD sits at the same
# relative position.
#
# DEFAULT = the standard CONSOLE in-game HUD (top-left scoreboard), calibrated
# and visually verified against real PS5 gameplay (1280x720): 3-letter team
# abbreviations, a dedicated white score panel, clock bottom-left. This is the
# product's real input - a user's own recorded gameplay.
#
# The FC Pro esports BROADCAST overlay is a separate `fcpro_broadcast` variant
# (crest-next-to-score, shifting layout - messy; kept for reference/testing).
# Select a variant via capture: {"variant": "fcpro_broadcast"}.

game_id: ea-fc
edition: "26"
schema_version: "26.0-console"     # bump when a patch moves the HUD
reference_resolution: [1280, 720]

stat_screen:
  anchor_region: ss_title
  anchor_text: ["FULL TIME", "FULL-TIME", "MATCH FACTS", "FT", "HALF TIME"]
  min_static_frames: 3

regions:
  # --- console in-game scoreboard (top-left) - VERIFIED ----------------------
  # Score digits are black-on-white in their own panel (no crest adjacency).
  - name: score_home
    rect: [0.115, 0.050, 0.024, 0.040]
    content_type: score
    scene: in_match
    whitelist: "0123456789"
    pattern: "^[0-9]{1,2}$"
    required: true
    meta: { role: score, team: home }

  - name: score_away
    rect: [0.115, 0.093, 0.024, 0.042]
    content_type: score
    scene: in_match
    whitelist: "0123456789"
    pattern: "^[0-9]{1,2}$"
    required: true
    meta: { role: score, team: away }

  # Clock: black-on-white, bottom-left of the scoreboard block.
  - name: clock
    rect: [0.042, 0.103, 0.048, 0.028]
    content_type: clock
    scene: in_match
    whitelist: "0123456789:"
    pattern: "^[0-9]{1,3}:[0-9]{2}$"
    required: true
    meta: { role: clock }

  # --- match-facts / stat screen (UNCALIBRATED placeholders) ------------------
  # Retained so metric definitions resolve; calibrate against a clip that shows a
  # half/full-time stats screen.
  - name: ss_title
    rect: [0.360, 0.080, 0.280, 0.070]
    content_type: text
    scene: stat_screen
    meta: { role: title }
  - name: ss_possession_home
    rect: [0.300, 0.300, 0.070, 0.050]
    content_type: percent
    scene: stat_screen
    whitelist: "0123456789%"
    meta: { role: stat, stat: possession, team: home, unit: percent }
  - name: ss_possession_away
    rect: [0.630, 0.300, 0.070, 0.050]
    content_type: percent
    scene: stat_screen
    whitelist: "0123456789%"
    meta: { role: stat, stat: possession, team: away, unit: percent }
  - name: ss_shots_home
    rect: [0.300, 0.370, 0.070, 0.050]
    content_type: digits
    scene: stat_screen
    whitelist: "0123456789"
    meta: { role: stat, stat: shots, team: home }
  - name: ss_shots_away
    rect: [0.630, 0.370, 0.070, 0.050]
    content_type: digits
    scene: stat_screen
    whitelist: "0123456789"
    meta: { role: stat, stat: shots, team: away }

# Alternate layouts. Selected via capture: {"variant": "<key>"}.
variants:
  # FC Pro Open esports broadcast overlay (calibrated on 640x360 broadcast clips).
  # Adversarial: team crest abuts the score; a standings panel can shift the
  # scoreboard. Score regions are widened to span the box-width variance.
  fcpro_broadcast:
    schema_version: "26.0-fcpro-broadcast"
    reference_resolution: [640, 360]
    regions:
      - name: score_home
        rect: [0.153, 0.047, 0.045, 0.034]
        content_type: score
        scene: in_match
        whitelist: "0123456789"
        required: true
        meta: { role: score, team: home }
      - name: score_away
        rect: [0.153, 0.081, 0.045, 0.033]
        content_type: score
        scene: in_match
        whitelist: "0123456789"
        required: true
        meta: { role: score, team: away }
      - name: clock
        rect: [0.077, 0.100, 0.058, 0.036]
        content_type: clock
        scene: in_match
        whitelist: "0123456789:"
        required: true
        meta: { role: clock }
