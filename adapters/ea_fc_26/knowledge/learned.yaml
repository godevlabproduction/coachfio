- id: how-does-the-overload-set-pieces-quick-tactic-impact-midfiel
  detail: The "Overload Set Pieces" quick tactic commits extra outfield players, including
    midfielders, into the penalty box during attacking corners and free kicks. Consequently,
    this leaves fewer players positioned outside the area to provide defensive cover,
    significantly compromising midfield balance and increasing vulnerability to fast
    counter-attacks during defensive transitions.
