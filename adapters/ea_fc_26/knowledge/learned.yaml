- id: how-does-overload-set-pieces-quick-tactic-impact-defensive-t
  detail: Activating the 'Overload Set Pieces' quick tactic commits additional outfield
    players into the penalty box during attacking corners and free kicks. This reduces
    the number of players positioned in rest defense and around the perimeter of the
    area, leaving fewer defenders back to slow down or break up counter-attacks. Consequently,
    it significantly heightens vulnerability to rapid transitions if the opponent
    wins and clears the ball.
