- id: best-playstyles-for-goalkeeper-roles
  detail: 'All three keeper roles - Goalkeeper, Ball Playing and Sweeper Keeper -
    share the SAME gold four: Far Reach+, Footwork+, Rush Out+ and Deflector+. Below
    that the consistent base across every role is Cross Claimer, Far Throw, Pinged
    Pass, Long Ball, Tiki Taka, Press Proven, First Touch and Incisive Pass. Because
    the top traits do not change with the role, pick a keeper on Far Reach and Footwork
    first and choose the role for how far you want him to sweep, not for which PlayStyles
    it rewards.'
