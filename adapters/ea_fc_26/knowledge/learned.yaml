- id: creation-and-midfield-meta-playstyles
  detail: Incisive Pass+ is vital for CAMs and central midfielders zipping accurate
    through-balls. Technical+ is close to mandatory for players who rely on tight
    R1/L1 dribbling to turn in crowded midfield areas. Tiki-Taka+ is crucial for quick
    one-touch passing sequences in congested spaces. Direct build-up advice through
    the middle should name the midfielder who has one of these rather than the position
    generally.
