- id: best-playstyles-for-centre-back-roles
  detail: 'CBs are unified by Intercept+ and Bruiser+ across every role; Anticipate+,
    Block, Jockey and Slide Tackle form the defensive foundation, with Aerial Fortress
    the key physical trait. CB Defender - gold: Intercept+, Bruiser+, Anticipate+,
    Jockey+; then Quick Step, Block, Pinged Pass, Aerial Fortress, Slide Tackle, Tiki
    Taka, Press Proven, Relentless. CB Stopper - gold: Intercept+, Bruiser+, Anticipate+,
    Jockey+; then Quick Step, Block, Slide Tackle, Tiki Taka, Pinged Pass, Relentless,
    Aerial Fortress, First Touch. CB Ball Playing Defender - gold: Intercept+, Bruiser+,
    Anticipate+, Jockey+; then Quick Step, Block, Pinged Pass, Tiki Taka, First Touch,
    Press Proven, Aerial Fortress, Slide Tackle. CB Wide Back - gold: Intercept+,
    Anticipate+, Quick Step+, Jockey+; then Bruiser, Block, Pinged Pass, Aerial Fortress,
    Slide Tackle, Tiki Taka, Press Proven, Relentless. Wide Back is the only CB role
    that takes Quick Step+ over Bruiser+, because it defends space out wide rather
    than duels in the middle. If a centre-back has neither Intercept+ nor Bruiser+,
    expect to lose duels and get cut open by through balls whatever the positioning.'
