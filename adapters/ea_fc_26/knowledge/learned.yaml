- id: how-does-tactical-custom-tactics-switching-function-during-a
  detail: During active gameplay in EA Sports FC 26, players can switch custom tactics
    without pausing by pressing Left on the D-pad to open the in-match tactical overlay.
    From this menu, selecting the corresponding directional input activates one of
    up to five pre-configured custom tactic presets. This immediately updates the
    team's formation, tactical approach, and assigned player roles on the fly.
