- id: essential-meta-passing-playstyles-pinged-pass-and-incisive-p
  detail: Pinged Pass accelerates ground passes through dense midfields without causing
    heavy receiving touches; Incisive Pass delivers sharper, faster through balls
    into space for attacking runs. BOTH ARE PLAYSTYLES, NOT INPUTS - there is no button
    for them and no control to give. They passively improve the passes a player who
    HAS them makes. The driven pass (R1+X / RB+A) and the through ball (Triangle /
    Y) are the inputs those PlayStyles improve; do not present them as the way to
    trigger a PlayStyle. The gold + versions are markedly stronger than the base grey
    ones.
