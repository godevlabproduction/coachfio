- id: how-do-specific-player-roles-affect-ai-off-ball-positioning-
  detail: In EA Sports FC 26, assigned player roles and focuses directly determine
    an AI player's recovery path, urgency, and defensive shape when possession is
    lost. Depending on the specific role (such as holding, dropping to form backline
    cover, or stepping out to contest passing lanes), the AI adjusts how quickly and
    deeply it tracks back into the base defensive structure. Players with higher role
    familiarity (Role+ and Role++) execute these off-ball defensive transitions with
    improved positioning awareness and reaction times.
