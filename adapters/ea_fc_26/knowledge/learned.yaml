- id: how-do-intercept-playstyle-animations-assist-manual-cb-jocke
  detail: In *EA Sports FC 26*, the Intercept PlayStyle assists manual CB jockeying
    by granting greater defensive reach and triggering contextual leg-extension animations
    to automatically cut off tight passing lanes. These animations allow defenders
    to intercept low driven passes and cutbacks inside the penalty area without needing
    a manual tackle input or breaking jockey posture. Furthermore, they increase the
    probability of cleanly retaining the ball rather than giving away hazardous deflections
    or rebounds inside the box.
