entries:
- id: what-does-the-inverted-wingback-role-do
  detail: In EA Sports FC 26, the Inverted Wingback is a player role assigned to wide
    defenders (LB/RB). When their team has possession, the player moves forward and
    adopts a central position high up the pitch. This role is designed to support
    midfield build-up play and create numerical superiority in central attacking areas.
  sources:
  - https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHcqFhLjq_8tqSaeLHgO2u6zO6pkrKOAC5n2cl7skbUx_bZPsxDxR0NVYYlgM9ONF3ecZpmAQNy1dm_fQoWQjQYyDqFam-UvVeLUtHUJJJ32w5d
