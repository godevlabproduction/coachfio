    Finesse Shot+, Low Driven+, Rapid, Incisive Pass. Target Forward: Finesse Shot+,
    Enforcer, Precision Header, Low Driven+. False 9: Finesse Shot+, Incisive Pass,
    Low Driven+, Technical. Finishing traits dominate every striker role - Finesse
