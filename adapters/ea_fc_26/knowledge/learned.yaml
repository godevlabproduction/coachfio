- id: how-does-the-advanced-forward-role-affect-striker-positionin
  detail: In *EA Sports FC 26*, the Advanced Forward role positions the striker close
    to the opposition’s defensive line while actively moving to open passing lanes
    to support build-up play. Depending on the assigned focus (Attack, Support, or
    Versatile), the player balances showing as a receiving outlet with making direct
