# Alembic config. The database URL is NOT here - migrations/env.py reads it from
# core.config.get_settings() (i.e. .env / DATABASE_URL), so there is exactly one
# place a connection string lives.
[alembic]
script_location = migrations
# Keep generated filenames sortable: 0002_<slug>.py, not <hash>_<slug>.py.
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
