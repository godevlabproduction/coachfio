</div>
<div>
<label class="block font-label-mono text-label-mono text-on-surface mb-xs flex justify-between" for="password">
                        Password
                        <a class="text-primary hover:text-primary-fixed-dim transition-colors" href="#">Forgot?</a>
</label>

</div>
<button class="w-full bg-primary hover:bg-on-primary-fixed-variant text-on-primary font-body-sm text-body-sm rounded-lg py-sm px-md transition-colors font-medium" type="submit">
                    Sign in
                </button>
</form>
<div class="mt-lg relative">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-border-subtle"></div>
</div>

</div>
</div>
<div class="mt-lg">
