<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coachfio - Analyzing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/hub.css">
<link rel="stylesheet" href="/hub-dark.css">
<link rel="stylesheet" href="/palettes.css">
<link rel="stylesheet" href="/app-glass.css">
</head>
<body class="hub hub--glass" data-hub-page="hub" data-game-id="ea-fc" data-app-page>
<a class="skip-link" href="#main">Skip to content</a>


<main id="main" class="container page">
  <div class="reveal" style="max-width:560px;margin-inline:auto">

    <div class="text-center">
      <p class="eyebrow">Analyzing</p>
      <h1 class="t-display" style="margin-top:8px" data-cx-heading>Watching your match</h1>
      <p class="muted" style="margin-top:10px" data-cx-step>Starting up</p>
    </div>

    <div style="margin-top:32px">
      <div class="row-between t-sm" style="margin-bottom:8px">
        <span class="muted">Progress</span>
        <span class="mono" data-cx-pct>0%</span>
      </div>
      <div class="progress">
        <div class="progress__bar" data-cx-bar style="width:0%"></div>
      </div>
    </div>

    <div class="card" style="margin-top:32px">
      <div class="steps">
        <div class="step" data-step="upload">
          <span class="step__dot"><span class="material-symbols-outlined">upload</span></span>
          Uploading to the coach
        </div>
        <div class="step" data-step="watch">
          <span class="step__dot"><span class="material-symbols-outlined">visibility</span></span>
          Watching the full match
        </div>
        <div class="step" data-step="score">
          <span class="step__dot"><span class="material-symbols-outlined">scoreboard</span></span>
          Reading the scoreboard
        </div>
        <div class="step" data-step="write">
          <span class="step__dot"><span class="material-symbols-outlined">edit_note</span></span>
          Writing your report
        </div>
      </div>
    </div>

    <p class="faint t-sm text-center" style="margin-top:24px">
      A full match takes about 2-3 minutes. You can leave this page - the report is saved.
    </p>

    <div data-cx-error hidden style="margin-top:24px"></div>

  </div>
</main>


<script src="/app-shell.js"></script>
<script src="/cx-select.js"></script>
<script src="/coach.js"></script>
</body>
</html>
