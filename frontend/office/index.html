<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coachfio - Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="appbar">
  <div class="appbar__inner">
    <a class="brand" href="/">
      <span class="brand__mark"><span class="material-symbols-outlined filled">sports_soccer</span></span>
      Coachfio
    </a>
    <nav class="nav" aria-label="Primary">
      <a class="nav__link" href="/upload/" data-nav="/upload/"><span class="material-symbols-outlined">upload</span>Upload</a>
      <a class="nav__link" href="/report/" data-nav="/report/"><span class="material-symbols-outlined">analytics</span>Report</a>
      <a class="nav__link" href="/moment/" data-nav="/moment/"><span class="material-symbols-outlined">play_circle</span>Moments</a>
      <a class="nav__link" href="/statistics/" data-nav="/statistics/"><span class="material-symbols-outlined">trending_up</span>Statistics</a>
    </nav>
    <div class="appbar__end">
      <a class="btn btn--primary btn--sm" href="/upload/">
        <span class="material-symbols-outlined">add</span>New analysis
      </a>
      <a class="nav__link" href="/account/" data-nav="/account/"><span class="material-symbols-outlined">person</span>Account</a>
    </div>
  </div>
</header>

<main id="main" class="container page">

  <div class="page-head">
    <div>
      <h1 class="t-display">Office</h1>
      <p class="page-head__sub">Your clients, their progress, and your conversations.</p>
    </div>
  </div>

  <div data-cx-office-overview></div>

  <div class="grid split split--panel">
    <div data-cx-clients>
      <div class="stack-s">
        <div class="skeleton" style="height:140px"></div>
        <div class="skeleton" style="height:140px"></div>
      </div>
    </div>
    <aside data-cx-office-chat></aside>
  </div>

</main>

<nav class="tabbar" aria-label="Primary">
  <a class="tabbar__item" href="/upload/" data-nav="/upload/"><span class="material-symbols-outlined">upload</span>Upload</a>
  <a class="tabbar__item" href="/report/" data-nav="/report/"><span class="material-symbols-outlined">analytics</span>Report</a>
  <a class="tabbar__item" href="/moment/" data-nav="/moment/"><span class="material-symbols-outlined">play_circle</span>Moments</a>
  <a class="tabbar__item" href="/statistics/" data-nav="/statistics/"><span class="material-symbols-outlined">trending_up</span>Statistics</a>
  <a class="tabbar__item" href="/account/" data-nav="/account/"><span class="material-symbols-outlined">person</span>Account</a>
</nav>

<script src="/coach.js"></script>
</body>
</html>
